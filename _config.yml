title: Zept Security Research
description: Cybersecurity Research, CVE Analysis and Vulnerability Write-ups
url: "https://dungkhac111.github.io"
baseurl: ""

theme: jekyll-theme-hacker

permalink: /post/:title/

plugins:
  - jekyll-seo-tag

# Author info
author:
  name: Zept
  github: dungkhac111

# Build settings
markdown: kramdown
kramdown:
  toc_levels: "2..3"

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      toc: true

show_downloads: false
